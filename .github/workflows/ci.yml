name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # GitHub's dependency alerts do not read bun.lock, so the lockfile is checked here against
      # the OSV database. The scanner is a release binary pinned by version and SHA-256 (the digest
      # published with the release and in its SLSA provenance); a mismatch stops the job. A known
      # advisory fails the build unless osv-scanner.toml lists it, with its reason and a date after
      # which it fails again.
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: v2.7.1
          OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: Scan dependencies
        run: |
          "$RUNNER_TEMP/osv-scanner" scan \
            --lockfile bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile contracts
        run: bun run compile

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Coverage
        run: bun run coverage
